services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-restinfo}
      POSTGRES_USER: ${POSTGRES_USER:-restinfo}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-restinfo_dev}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-restinfo} -d ${POSTGRES_DB:-restinfo}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: ./server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-restinfo}:${DB_PASSWORD:-restinfo_dev}@postgres:5432/${POSTGRES_DB:-restinfo}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-kostya.alone18@yandex.ru}
      MEDIA_DIR: /data/media
      UPDATES_DIR: /data/updates
      PORT: 3000
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
    volumes:
      - media_data:/data/media
      - updates_data:/data/updates
      - ./import:/import:ro
    ports:
      - "3000:3000"

volumes:
  postgres_data:
  media_data:
  updates_data:
